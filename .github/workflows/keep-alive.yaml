name: Keep Streamlit App Awake

on:
  schedule:
    # Se ejecuta cada 6 horas pasados los 15 minutos (UTC)
    # Formato: minuto hora día mes día-semana
    - cron: "15 */6 * * *"
  workflow_dispatch:  # Permite ejecutarlo manualmente desde la pestaña Actions

permissions:
  contents: write

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Pull latest changes
        run: |
          git pull --rebase origin ${{ github.ref_name }}

      - name: Create empty commit and push
        run: |
          git commit --allow-empty -m "chore: keep alive [$(date -u +'%Y-%m-%d %H:%M:%S UTC')]"
          git push origin ${{ github.ref_name }}
